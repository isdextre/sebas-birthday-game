<!doctype html><html lang="es"><meta charset="utf-8"><title>Revisión de escenas</title><style>@font-face{font-family:Pixelify;src:url('/assets/fonts/pixelify.woff2')}body{height:100vh;overflow:hidden;margin:0;background:#153e37;color:white;font:14px system-ui}nav{display:flex;gap:8px;padding:8px}button{padding:8px}canvas{display:block;width:100%;height:calc(100vh - 54px);image-rendering:pixelated}</style>
<nav><button data-view="forest">Bosque</button><button data-view="flight">Vuelo</button><button data-view="dance">Baile</button><button data-view="cake">Pastel</button><button data-view="count">Cuenta atrás</button><button data-view="clap">Felicitación</button></nav><canvas width="960" height="540"></canvas>
<script type="module">
import {BirthdayGame} from '/src/game.js';import{LEVEL}from'/src/level.js';
const canvas=document.querySelector('canvas'),g=new BirthdayGame(canvas);await g.art.load();await document.fonts.ready;
let view='forest';
for(const button of document.querySelectorAll('button'))button.onclick=()=>{view=button.dataset.view;g.inputs.clear();
 if(view==='forest'||view==='flight'){g.status='running';g.player.x=view==='forest'?6500:16600;g.player.y=250;g.player.flightActive=view==='flight';g.player.flightRemaining=6;g.cameraX=g.player.x-300;g.stageIndex=view==='forest'?1:3;}
 else{g.status='party';g.partyTime=({dance:5,cake:16,count:19,clap:26})[view];}
};
document.querySelector('button').click();let last=performance.now();function frame(now){const dt=Math.min(.03,(now-last)/1000);last=now;g.worldTime+=dt;if(g.status==='party'){const base=({dance:5,cake:16,count:19,clap:26})[view];g.partyTime=base+(now/1000)%1;}g.render();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
